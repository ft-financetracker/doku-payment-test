<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>DOKU Secure Payment Test</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f4f6f8}.card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.08)}.badge{display:inline-block;padding:6px 10px;margin-bottom:14px;border-radius:999px;background:#fff3df;color:#a25b00;font-size:12px;font-weight:700}h1{margin:0 0 8px;font-size:26px}.subtitle{margin:0 0 24px;color:#6b7280;font-size:14px;line-height:1.5}.payment-detail{display:none;margin-bottom:20px;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}.detail-row{padding:12px 14px;border-bottom:1px solid #eef0f3}.detail-row:last-child{border-bottom:none}.detail-label{display:block;margin-bottom:4px;color:#6b7280;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.detail-value{display:block;color:#191d23;font-size:14px;line-height:1.45;word-break:break-word}.amount-value{font-size:22px;font-weight:700}.status-pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2f7;color:#374151;font-size:11px;font-weight:700}button{width:100%;padding:14px 16px;border:0;border-radius:12px;background:#191d23;color:#fff;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.status{display:none;margin-top:16px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.status.loading{display:block;background:#edf5ff;color:#175aa8}.status.success{display:block;background:#ecfdf3;color:#067647}.status.error{display:block;background:#fff0f0;color:#b42318}.footer{margin-top:22px;text-align:center;color:#999;font-size:11px}
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">SANDBOX MODE</div>
    <h1>DOKU Secure Payment</h1>
    <p class="subtitle">Detail pembayaran diambil langsung dari backend. Nominal tidak ditentukan dari browser.</p>

    <div id="paymentDetail" class="payment-detail">
      <div class="detail-row"><span class="detail-label">Referensi</span><span id="referenceNumber" class="detail-value">-</span></div>
      <div class="detail-row"><span class="detail-label">Customer</span><span id="customerName" class="detail-value">-</span></div>
      <div class="detail-row"><span class="detail-label">Keterangan</span><span id="description" class="detail-value">-</span></div>
      <div class="detail-row"><span class="detail-label">Nominal Resmi</span><span id="amount" class="detail-value amount-value">-</span></div>
      <div class="detail-row"><span class="detail-label">Status</span><span id="paymentStatus" class="status-pill">-</span></div>
    </div>

    <button id="payButton" type="button" disabled>Memuat pembayaran...</button>
    <div id="statusBox" class="status loading">Memeriksa payment request...</div>
    <div class="footer">DOKU Sandbox • Secure Token Payment Test</div>
  </div>

  <script>
    const API_URL='https://script.google.com/macros/s/AKfycbznn7Acyvb23wN8IBgG95UGuv1fb0SZ-rbpebE2ZGVu-6qINGFwkDV7tyNUpi2CADqu/exec';
    const paymentDetail=document.getElementById('paymentDetail');
    const referenceNumber=document.getElementById('referenceNumber');
    const customerName=document.getElementById('customerName');
    const description=document.getElementById('description');
    const amountBox=document.getElementById('amount');
    const paymentStatus=document.getElementById('paymentStatus');
    const payButton=document.getElementById('payButton');
    const statusBox=document.getElementById('statusBox');
    const TOKEN_STORAGE_KEY='doku_secure_payment_token';
    const queryParams=new URLSearchParams(window.location.search);
    const hashParams=new URLSearchParams(window.location.hash?window.location.hash.substring(1):'');
    const tokenFromUrl=String(hashParams.get('token')||queryParams.get('token')||'').trim();

    if(tokenFromUrl){
      try{sessionStorage.setItem(TOKEN_STORAGE_KEY,tokenFromUrl);}catch(err){}
      try{history.replaceState(null,document.title,window.location.pathname);}catch(err){}
    }

    let storedToken='';
    try{storedToken=sessionStorage.getItem(TOKEN_STORAGE_KEY)||'';}catch(err){}

    const paymentToken=String(tokenFromUrl||storedToken||'').trim();
    let currentPayment=null;

    if(!paymentToken){showError('Payment token tidak ditemukan. Gunakan link pembayaran yang valid.');}
    else if(!/^[a-f0-9]{128}$/i.test(paymentToken)){showError('Link pembayaran tidak valid atau sudah tidak tersedia.');}
    else{loadSecurePayment();}

    payButton.addEventListener('click',function(){
      if(!currentPayment||currentPayment.can_pay!==true)return;
      createSecurePayment();
    });

    function loadSecurePayment(){
      setStatus('loading','Memeriksa payment request...');
      payButton.disabled=true;
      payButton.textContent='Memuat pembayaran...';
      jsonpRequest('getSecurePayment',paymentToken,function(response){
        if(!response||response.success!==true||!response.data){showError(response?.message||'Payment request tidak dapat dibaca.');return;}
        currentPayment=response.data;
        renderPayment(currentPayment);
      });
    }

    function renderPayment(data){
      referenceNumber.textContent=data.reference_number||'-';
      customerName.textContent=data.customer_name||'-';
      description.textContent=data.description||'-';
      amountBox.textContent=formatMoney(data.amount,data.currency||'IDR');
      paymentStatus.textContent=data.status||'-';
      paymentDetail.style.display='block';

      if(data.status==='PAID'){
        payButton.disabled=true;
        payButton.textContent='Pembayaran Sudah Berhasil';
        setStatus('success','Pembayaran ini sudah berhasil.');
        return;
      }

      if(data.status==='EXPIRED'){
        payButton.disabled=true;
        payButton.textContent='Pembayaran Kedaluwarsa';
        showError('Link pembayaran ini sudah kedaluwarsa.');
        return;
      }

      if(data.can_pay!==true){
        payButton.disabled=true;
        payButton.textContent='Pembayaran Tidak Tersedia';
        showError('Pembayaran belum dapat diproses untuk status ini.');
        return;
      }

      payButton.disabled=false;
      payButton.textContent=data.payment_created===true?'Lanjutkan Pembayaran':'Bayar dengan DOKU';
      setStatus('success','Detail pembayaran berhasil diverifikasi dari backend.');
    }

    function createSecurePayment(){
      payButton.disabled=true;
      payButton.textContent='Memproses...';
      setStatus('loading','Membuat transaksi DOKU...');
      jsonpRequest('createSecurePayment',paymentToken,function(response){
        if(!response||response.success!==true){payButton.disabled=false;payButton.textContent='Coba Lagi';showError(response?.message||'Gagal membuat pembayaran.');return;}
        const paymentUrl=response?.data?.payment_url;
        if(!paymentUrl){payButton.disabled=false;payButton.textContent='Coba Lagi';showError('Payment URL tidak ditemukan.');return;}
        setStatus('loading',response?.data?.reused===true?'Melanjutkan transaksi DOKU yang sudah dibuat...':'Berhasil. Mengarahkan ke DOKU...');
        window.location.href=paymentUrl;
      });
    }

    function jsonpRequest(action,token,callback){
      const callbackName='dokuSecureCallback_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      const script=document.createElement('script');
      const timeout=setTimeout(function(){cleanupJsonp(callbackName,script);showError('Server pembayaran tidak merespons. Silakan coba lagi.');payButton.disabled=false;payButton.textContent='Coba Lagi';},20000);
      window[callbackName]=function(response){clearTimeout(timeout);cleanupJsonp(callbackName,script);callback(response);};
      script.src=API_URL+'?action='+encodeURIComponent(action)+'&token='+encodeURIComponent(token)+'&callback='+encodeURIComponent(callbackName);
      script.onerror=function(){clearTimeout(timeout);cleanupJsonp(callbackName,script);showError('Tidak dapat menghubungi server pembayaran.');payButton.disabled=false;payButton.textContent='Coba Lagi';};
      document.body.appendChild(script);
    }

    function cleanupJsonp(callbackName,script){
      if(script&&script.parentNode)script.remove();
      try{delete window[callbackName];}catch(err){}
    }

    function formatMoney(amount,currency){
      const number=Number(amount);
      if(!Number.isFinite(number))return '-';
      try{return new Intl.NumberFormat('id-ID',{style:'currency',currency:currency||'IDR',maximumFractionDigits:0}).format(number);}
      catch(err){return 'Rp'+number.toLocaleString('id-ID');}
    }

    function setStatus(type,message){statusBox.className='status '+type;statusBox.textContent=message;}
    function showError(message){setStatus('error',message);}
  </script>
</body>
</html>
