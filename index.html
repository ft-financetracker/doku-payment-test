<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DOKU Payment Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .card {
      width: 100%;
      max-width: 420px;

      background: #ffffff;
      border-radius: 20px;
      padding: 28px;

      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;

      margin-bottom: 14px;

      border-radius: 999px;

      background: #fff3df;
      color: #a25b00;

      font-size: 12px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 26px;

      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d7dce3;
      border-radius: 12px;

      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #333333;
    }

    button {
      width: 100%;

      padding: 14px 16px;

      border: none;
      border-radius: 12px;

      background: #191d23;
      color: #ffffff;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      display: none;

      margin-top: 16px;
      padding: 12px;

      border-radius: 10px;

      font-size: 13px;
      line-height: 1.5;
    }

    .status.loading {
      display: block;

      background: #edf5ff;
      color: #175aa8;
    }

    .status.error {
      display: block;

      background: #fff0f0;
      color: #b42318;
    }

    .footer {
      margin-top: 22px;

      text-align: center;

      color: #999999;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="badge">
      SANDBOX MODE
    </div>

    <h1>DOKU Payment Test</h1>

    <p class="subtitle">
      Test pembayaran menggunakan GitHub Pages,
      Google Apps Script, Spreadsheet dan DOKU Checkout.
    </p>


    <form id="paymentForm">

      <div class="field">

        <label for="name">
          Nama
        </label>

        <input
          id="name"
          type="text"
          value="Adhit Test"
          placeholder="Nama customer"
          required
        >

      </div>


      <div class="field">

        <label for="amount">
          Nominal Pembayaran
        </label>

        <input
          id="amount"
          type="number"
          value="10000"
          min="1"
          required
        >

      </div>


      <button
        id="payButton"
        type="submit"
      >
        Bayar dengan DOKU
      </button>


      <div
        id="status"
        class="status"
      ></div>

    </form>


    <div class="footer">
      DOKU Sandbox • Payment Test
    </div>

  </div>


  <script>

    const API_URL =
      'https://script.google.com/macros/s/AKfycbznn7Acyvb23wN8IBgG95UGuv1fb0SZ-rbpebE2ZGVu-6qINGFwkDV7tyNUpi2CADqu/exec';


    const form =
      document.getElementById('paymentForm');

    const button =
      document.getElementById('payButton');

    const statusBox =
      document.getElementById('status');


    form.addEventListener(
      'submit',
      function (event) {

        event.preventDefault();


        const name =
          document
            .getElementById('name')
            .value
            .trim();


        const amount =
          Number(
            document
              .getElementById('amount')
              .value
          );


        if (!name) {
          showError('Nama wajib diisi.');
          return;
        }


        if (
          !Number.isFinite(amount) ||
          amount <= 0
        ) {
          showError(
            'Nominal pembayaran tidak valid.'
          );

          return;
        }


        createPayment(
          name,
          amount
        );
      }
    );


    function createPayment(
      name,
      amount
    ) {

      setLoading(true);


      const callbackName =
        'dokuCallback_' +
        Date.now();


      window[callbackName] =
        function (response) {

          cleanup(callbackName);


          if (
            !response ||
            response.success !== true
          ) {

            showError(
              response?.message ||
              'Gagal membuat pembayaran.'
            );

            return;
          }


          const paymentUrl =
            response?.data?.payment_url;


          if (!paymentUrl) {

            showError(
              'Payment URL tidak ditemukan.'
            );

            return;
          }


          statusBox.className =
            'status loading';

          statusBox.textContent =
            'Berhasil. Mengarahkan ke DOKU...';


          window.location.href =
            paymentUrl;
        };


      const url =
        API_URL +

        '?action=createPayment' +

        '&name=' +
        encodeURIComponent(name) +

        '&amount=' +
        encodeURIComponent(amount) +

        '&callback=' +
        encodeURIComponent(callbackName);


      const script =
        document.createElement('script');


      script.id =
        callbackName;


      script.src =
        url;


      script.onerror =
        function () {

          cleanup(callbackName);

          showError(
            'Tidak dapat menghubungi server pembayaran.'
          );
        };


      document.body.appendChild(
        script
      );
    }


    function cleanup(
      callbackName
    ) {

      const script =
        document.getElementById(
          callbackName
        );


      if (script) {
        script.remove();
      }


      try {
        delete window[
          callbackName
        ];
      } catch (err) {}
    }


    function setLoading(
      loading
    ) {

      button.disabled =
        loading;


      if (loading) {

        button.textContent =
          'Memproses...';

        statusBox.className =
          'status loading';

        statusBox.textContent =
          'Membuat transaksi DOKU...';

      } else {

        button.textContent =
          'Bayar dengan DOKU';
      }
    }


    function showError(
      message
    ) {

      button.disabled =
        false;

      button.textContent =
        'Bayar dengan DOKU';

      statusBox.className =
        'status error';

      statusBox.textContent =
        message;
    }

  </script>

</body>
</html>
