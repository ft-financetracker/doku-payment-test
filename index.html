<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0B132B"
  >

  <meta
    name="description"
    content="SPP Payment Demo — Sandbox"
  >

  <title>SPP Pay Demo</title>

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="icon"
    type="image/png"
    href="./icons/icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="./icons/icon-192.png"
  >

  <link
    rel="stylesheet"
    href="./css/app.css"
  >
</head>

<body>

  <!-- ======================================================
       APP SHELL
       ====================================================== -->

  <div
    id="app"
    class="app-shell"
  >

    <header class="topbar">

      <div class="brand">

        <div class="brand-mark">
          S
        </div>

        <div>

          <div class="brand-title">
            SPP Pay
          </div>

          <div class="brand-subtitle">
            Finance Tracker Demo
          </div>

        </div>

      </div>

      <span class="sandbox-badge">
        SANDBOX
      </span>

    </header>


    <main
      id="page"
      class="page"
    >
      <!-- Rendered by app.js -->
    </main>


    <nav class="bottom-nav">

      <button
        class="nav-item active"
        data-page="home"
        type="button"
      >
        <span class="nav-icon">⌂</span>
        <span>Beranda</span>
      </button>

      <button
        class="nav-item"
        data-page="bills"
        type="button"
      >
        <span class="nav-icon">▤</span>
        <span>Tagihan</span>
      </button>

      <button
        class="nav-item"
        data-page="history"
        type="button"
      >
        <span class="nav-icon">↻</span>
        <span>Riwayat</span>
      </button>

      <button
        class="nav-item"
        data-page="profile"
        type="button"
      >
        <span class="nav-icon">○</span>
        <span>Profil</span>
      </button>

    </nav>

  </div>


  <!-- ======================================================
       BACKEND SETUP MODAL
       ====================================================== -->

  <div
    id="backendSetup"
    class="modal-backdrop hidden"
  >

    <section class="modal-card">

      <div class="modal-icon">
        ⚙
      </div>

      <p class="eyebrow">
        SETUP PERTAMA
      </p>

      <h2>
        Hubungkan backend demo
      </h2>

      <p class="modal-copy">
        Paste URL Web App Apps Script SPP Demo yang berakhiran
        <strong>/exec</strong>.
        URL disimpan hanya di browser ini.
      </p>

      <label
        class="field-label"
        for="backendUrl"
      >
        Apps Script Web App URL
      </label>

      <input
        id="backendUrl"
        class="text-input"
        type="url"
        placeholder="https://script.google.com/macros/s/.../exec"
        autocomplete="off"
      >

      <p
        id="setupMessage"
        class="form-message"
      ></p>

      <button
        id="saveBackendButton"
        class="primary-button"
        type="button"
      >
        Simpan & Tes Koneksi
      </button>

    </section>

  </div>


  <!-- ======================================================
       LOADING
       ====================================================== -->

  <div
    id="loadingOverlay"
    class="loading-backdrop hidden"
  >
    <div class="loading-card">
      <div class="spinner"></div>
      <span id="loadingText">
        Memuat...
      </span>
    </div>
  </div>


  <!-- ======================================================
       TOAST
       ====================================================== -->

  <div
    id="toast"
    class="toast hidden"
  ></div>


  <script src="./js/app.js"></script>
</body>
</html>
