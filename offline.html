<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta
    name="theme-color"
    content="#0B132B"
  >
  <title>SPP Pay Demo — Offline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #F3F6FA;
      color: #172033;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        "Segoe UI",
        sans-serif;
    }

    .card {
      width: min(100%, 420px);
      padding: 28px;
      border-radius: 26px;
      background: #FFFFFF;
      box-shadow:
        0 18px 50px rgba(11, 19, 43, 0.10);
      text-align: center;
    }

    .mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: #0B132B;
      color: #B6FF00;
      font-size: 25px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      color: #0B132B;
      font-size: 24px;
    }

    p {
      margin: 10px 0 0;
      color: #6E7788;
      font-size: 13px;
      line-height: 1.65;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="mark">
      S
    </div>

    <h1>
      Sedang offline
    </h1>

    <p>
      Dashboard dasar masih dapat dibuka dari cache,
      tetapi pengecekan tagihan dan pembayaran membutuhkan
      koneksi internet.
    </p>

  </main>

</body>
</html>
