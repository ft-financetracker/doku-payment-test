<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FT Pay • Offline</title>
  <meta name="theme-color" content="#0B132B">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FT Pay">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
    :root{
      --navy:#0B132B;
      --navy-2:#071126;
      --blue:#1E3A8A;
      --blue-2:#2E64D7;
      --green:#B6FF00;
      --green-soft:#D3FF42;
      --white:#FFFFFF;
      --ink:#EAF0FF;
      --muted:#9AABCE;
      --line:rgba(125,154,214,.18);
      --panel:rgba(12,24,55,.86);
      --panel-2:rgba(17,36,78,.58);
      --danger:#FF6B78;
      --warning:#F4B942;
      --success:#B6FF00;
      --shadow:0 30px 80px rgba(0,0,0,.38);
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--navy)}
    body{
      margin:0;min-height:100vh;min-height:100dvh;padding:22px;
      display:grid;place-items:center;overflow-x:hidden;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(900px 620px at 100% 0%,rgba(30,58,138,.42),transparent 58%),
        radial-gradient(700px 520px at 0% 100%,rgba(22,55,125,.30),transparent 55%),
        linear-gradient(145deg,#071126 0%,#0B132B 50%,#08142F 100%);
    }
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;
      background:
        linear-gradient(125deg,transparent 0 72%,rgba(182,255,0,.85) 72.15% 72.35%,transparent 72.5%),
        repeating-linear-gradient(135deg,transparent 0 22px,rgba(46,100,215,.10) 23px 24px);
      mask-image:linear-gradient(to bottom,transparent 0,#000 24%,#000 100%);
    }
    .shell{width:min(100%,490px);position:relative;z-index:1}
    .brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 2px 15px}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand-mark{width:43px;height:43px;flex:0 0 43px;border-radius:13px;box-shadow:0 12px 26px rgba(0,0,0,.24)}
    .brand-copy{min-width:0}
    .brand-name{font-size:15px;font-weight:850;letter-spacing:-.015em;color:#fff;white-space:nowrap}
    .brand-sub{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);font-weight:700;margin-top:2px}
    .env-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;border:1px solid rgba(244,185,66,.32);background:rgba(244,185,66,.08);color:#FFD98C;font-size:9px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
    .env-dot{width:6px;height:6px;border-radius:50%;background:#F4B942;box-shadow:0 0 12px rgba(244,185,66,.9)}
    .card{position:relative;overflow:hidden;border:1px solid rgba(123,155,220,.20);border-radius:30px;padding:25px;background:linear-gradient(155deg,rgba(16,31,66,.96),rgba(8,19,43,.94));box-shadow:var(--shadow);backdrop-filter:blur(18px)}
    .card:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue-2),transparent)}
    .card:after{content:"";position:absolute;width:220px;height:220px;right:-115px;top:-105px;border-radius:50%;background:radial-gradient(circle,rgba(46,100,215,.22),transparent 70%);pointer-events:none}
    .eyebrow{display:flex;align-items:center;gap:8px;color:var(--green);font-size:10px;font-weight:850;letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px}
    .eyebrow:before{content:"";width:18px;height:2px;background:var(--green);border-radius:2px}
    h1{margin:0;font-size:clamp(26px,7vw,34px);line-height:1.04;letter-spacing:-.035em;color:#fff}
    .subtitle{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.65;max-width:390px}
    .hero{padding-bottom:20px;border-bottom:1px solid var(--line)}
    .security-row{display:flex;align-items:center;gap:8px;margin-top:14px;color:#B9C6E2;font-size:11px}
    .security-icon{width:20px;height:20px;display:grid;place-items:center;border-radius:7px;background:rgba(182,255,0,.08);border:1px solid rgba(182,255,0,.20);color:var(--green)}
    .detail{display:none;margin-top:18px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:rgba(255,255,255,.025)}
    .detail-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;padding:13px 14px;border-bottom:1px solid var(--line)}
    .detail-row:last-child{border-bottom:0}
    .detail-row.amount-row{background:linear-gradient(90deg,rgba(182,255,0,.055),rgba(30,58,138,.06))}
    .detail-label{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7185AE;padding-top:2px}
    .detail-value{font-size:13px;font-weight:700;color:#EAF0FF;text-align:right;max-width:280px;word-break:break-word}
    .amount-value{font-size:24px;line-height:1;font-weight:900;letter-spacing:-.03em;color:var(--green-soft)}
    .status-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;border:1px solid rgba(137,158,204,.20);background:rgba(137,158,204,.08);color:#C9D4EB;font-size:9px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}
    .status-pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 9px currentColor}
    .status-pill.open,.status-pill.payment_created,.status-pill.processing{color:#8DB6FF;border-color:rgba(75,130,240,.25);background:rgba(40,93,190,.10)}
    .status-pill.paid{color:var(--green);border-color:rgba(182,255,0,.25);background:rgba(182,255,0,.08)}
    .status-pill.expired,.status-pill.cancelled{color:#FF8E98;border-color:rgba(255,107,120,.25);background:rgba(255,107,120,.08)}
    .cta{width:100%;margin-top:16px;min-height:52px;border:0;border-radius:16px;padding:14px 18px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#B6FF00,#9FEA00);color:#071126;font-size:14px;font-weight:900;letter-spacing:-.01em;cursor:pointer;box-shadow:0 12px 28px rgba(182,255,0,.15);transition:transform .15s ease,filter .15s ease,opacity .15s ease}
    .cta:hover{transform:translateY(-1px);filter:brightness(1.04)}
    .cta:active{transform:translateY(0)}
    .cta:disabled{cursor:not-allowed;opacity:.48;filter:saturate(.55);box-shadow:none;transform:none}
    .cta svg{width:17px;height:17px}
    .secondary-btn{width:100%;margin-top:10px;min-height:48px;border:1px solid var(--line);border-radius:15px;padding:12px 16px;background:rgba(255,255,255,.025);color:#DCE6FA;font-size:13px;font-weight:800;cursor:pointer}
    .status-box{display:none;margin-top:12px;padding:12px 13px;border-radius:14px;font-size:11px;line-height:1.55;border:1px solid transparent}
    .status-box.loading{display:block;color:#AFC7F8;background:rgba(46,100,215,.08);border-color:rgba(46,100,215,.18)}
    .status-box.success{display:block;color:#D8FFA4;background:rgba(182,255,0,.055);border-color:rgba(182,255,0,.15)}
    .status-box.error{display:block;color:#FFB1B8;background:rgba(255,107,120,.07);border-color:rgba(255,107,120,.16)}
    .empty{display:none;margin-top:18px;padding:18px;border-radius:18px;border:1px dashed rgba(137,158,204,.28);background:rgba(255,255,255,.02);text-align:center}
    .empty-icon{width:46px;height:46px;margin:0 auto 10px;display:grid;place-items:center;border-radius:15px;background:rgba(46,100,215,.09);border:1px solid rgba(46,100,215,.18);color:#8FB4FF}
    .empty-title{font-size:13px;font-weight:850;color:#ECF2FF}
    .empty-copy{font-size:11px;line-height:1.55;color:#8396BD;margin-top:5px}
    .footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:15px;padding:0 3px;color:#65789F;font-size:9px}
    .footer strong{color:#95A8CF;font-weight:800}
    .install-btn{display:none;border:0;background:none;color:#AFC4ED;font:inherit;font-weight:800;cursor:pointer;padding:0}
    .spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(7,17,38,.25);border-top-color:#071126;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:390px){body{padding:16px}.card{padding:20px;border-radius:25px}.detail-row{grid-template-columns:1fr}.detail-value{text-align:left;max-width:none}.amount-value{font-size:23px}.brand-sub{display:none}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}}
</style></head><body><main class="shell"><header class="brandbar"><div class="brand"><img class="brand-mark" src="./icons/icon-192.png" alt="FT Pay"><div class="brand-copy"><div class="brand-name">Finance Tracker Pay</div><div class="brand-sub">Secure Payment Gateway</div></div></div></header><section class="card"><div class="hero"><div class="eyebrow">Offline</div><h1>Koneksi terputus.</h1><p class="subtitle">Sambungkan kembali internet untuk memverifikasi tagihan atau mengecek status pembayaran.</p></div><button class="cta" type="button" onclick="location.reload()"><span>Coba Lagi</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v6h-6"/></svg></button></section><footer class="footer"><span>Finance Tracker</span><span>FT Pay</span></footer></main></body></html>
